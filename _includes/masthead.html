<header class="masthead">
  <div class="wrap masthead__inner">
    <a class="masthead__name" href="{{ site.baseurl }}/">{{ site.title }}</a>
    <nav aria-label="Main">
      <ul class="site-nav">
        {% for link in site.data.navigation.main %}
          {% if link.url contains 'http' %}{% assign domain = '' %}{% else %}{% assign domain = site.baseurl %}{% endif %}
          <li>
            <a href="{{ domain }}{{ link.url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
          </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
